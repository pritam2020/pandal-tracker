<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9b1b30">
  <title>Offline | Pandal Tracker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff8ee;
      color: #3a2418;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      border: 1px solid #f0dfbe;
      padding: 28px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #9b1b30;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: #9b1b30;
    }
    p {
      margin: 10px 0;
      line-height: 1.6;
      color: #5b4334;
    }
    button {
      background: #9b1b30;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">OFFLINE</div>
    <h1>Pandal Tracker</h1>
    <p>You are offline right now, but your saved pandal progress is still available in this app.</p>
    <p>Once your connection is back, tap below to retry.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
