<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Durga Puja 2026 Pandal Tracker">
<meta name="theme-color" content="#9b1b30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pandal Tracker">

<title>Durga Puja 2026 Pandal Tracker</title>
<style>
  :root{
    --red:#9b1b30;
    --red-dark:#6b0f1f;
    --gold:#d4a017;
    --gold-light:#f5e6c8;
    --bg:#faf7f2;
    --surface:#ffffff;
    --text:#1a1410;
    --text-muted:#6b5d54;
    --green:#2e7d32;
    --green-light:#4caf50;
    --shadow-sm:0 2px 8px rgba(155,27,48,0.08);
    --shadow-md:0 8px 24px rgba(155,27,48,0.12);
    --shadow-lg:0 16px 40px rgba(155,27,48,0.16);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, #f5f0eb 100%);
    color: var(--text);
    padding-bottom: 80px;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
    padding: 32px 20px 40px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: -0.5px;
    font-weight: 700;
    line-height: 1.2;
  }

  header p {
    margin: 4px 0 16px;
    font-size: 0.95rem;
    opacity: 0.95;
    font-weight: 500;
  }

  .countdowns {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .countdown-box {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.8rem;
    transition: all 0.3s ease;
  }

  .countdown-box:hover {
    background: rgba(255,255,255,0.18);
  }

  .countdown-box b {
    display: block;
    font-size: 1rem;
    color: var(--gold-light);
    margin-top: 4px;
    font-weight: 700;
  }

  .install-banner {
    max-width: 980px;
    margin: 20px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fffaf2 0%, #fff4d6 100%);
    border: 1px solid #f2c86d;
    box-shadow: var(--shadow-sm);
    color: #6b4b00;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .install-banner.hidden {
    display: none;
  }

  .install-banner strong {
    color: var(--red);
  }

  .install-banner button {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-weight: 700;
  }

  .progress-wrap {
    max-width: 980px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  .progress-bar-outer {
    background: rgba(212,160,23,0.08);
    border-radius: 16px;
    height: 26px;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    border: 1px solid rgba(212,160,23,0.1);
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-light) 100%);
    width: 0%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .progress-label {
    text-align: center;
    margin-top: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .controls {
    max-width: 980px;
    margin: 24px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
  }

  #search {
    flex: 1 1 220px;
    min-width: 180px;
    padding: 11px 16px;
    border-radius: 10px;
    border: 1.5px solid #e5d9cc;
    font-size: 0.95rem;
    background: var(--surface);
    color: var(--text);
    transition: all 0.3s ease;
    box-shadow: var(--shadow-sm);
  }

  #search:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,160,23,0.1), var(--shadow-sm);
  }

  #search::placeholder {
    color: var(--text-muted);
  }

  .filter-btn, #installBtn, #resetBtn {
    flex: 0 0 auto;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--gold);
    background: var(--surface);
    color: var(--red);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.3s ease;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }

  .filter-btn:hover, #installBtn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background: #fafaf8;
  }

  .filter-btn.active {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  #resetBtn {
    border-color: #d0d0d0;
    color: var(--text-muted);
    background: #f9f7f4;
  }

  #resetBtn:hover {
    background: #f0ebe6;
  }

  main {
    max-width: 980px;
    margin: 28px auto;
    padding: 0 20px;
  }

  .zone {
    background: var(--surface);
    border-radius: 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    border: 1px solid #f0e9df;
    transition: all 0.3s ease;
  }

  .zone:hover {
    box-shadow: var(--shadow-md);
  }

  .zone[open] summary {
    border-bottom: 1px solid #f0e9df;
  }

  .zone summary {
    cursor: pointer;
    padding: 16px 18px;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--red);
    display: flex;
    justify-content: space-between;
    align-items: center;
    list-style: none;
    background: linear-gradient(135deg, #fff9f5 0%, #fffaf7 100%);
    transition: all 0.2s ease;
  }

  .zone summary:hover {
    background: linear-gradient(135deg, #fff5ef 0%, #fff7f3 100%);
  }

  .zone summary::-webkit-details-marker { display: none; }

  .zone summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    transition: transform 0.3s ease;
    font-size: 1.1rem;
  }

  .zone[open] summary::before {
    transform: rotate(90deg);
  }

  .zone summary .zone-count {
    font-size: 0.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--red) 0%, #c4162a 100%);
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(155,27,48,0.2);
  }

  .zone-body {
    padding: 8px 18px 16px;
  }

  .pandal-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 6px;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .pandal-row:hover {
    background: #fafaf8;
  }

  .pandal-row input[type="checkbox"] {
    width: 22px;
    height: 22px;
    margin-top: 1px;
    accent-color: var(--green);
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 6px;
  }

  .pandal-info { flex: 1; }

  .pandal-name {
    font-size: 0.98rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: all 0.2s ease;
  }

  .pandal-name:hover {
    color: var(--red);
  }

  .pandal-row.checked .pandal-name {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .uncertain-tag {
    font-size: 0.7rem;
    background: #fef3cd;
    color: #856404;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
    display: inline-block;
    border: 0.5px solid #ffeaa7;
  }

  .note-input {
    width: 100%;
    margin-top: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    border: 1px solid #e5d9cc;
    border-radius: 8px;
    background: #fafaf8;
    display: none;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .note-input:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--surface);
  }

  .note-toggle {
    font-size: 0.73rem;
    color: var(--red);
    cursor: pointer;
    text-decoration: underline;
    margin-left: 8px;
    transition: all 0.2s ease;
  }

  .note-toggle:hover {
    color: var(--red-dark);
  }

  .maps-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 11px;
    border-radius: 8px;
    background: linear-gradient(135deg, #f1f7f1 0%, #e8f5e9 100%);
    border: 1px solid #c8e6c9;
    color: var(--green);
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .maps-btn:hover {
    background: linear-gradient(135deg, #e8f5e9 0%, #dcedc8 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(46,125,50,0.15);
  }

  .maps-missing {
    background: linear-gradient(135deg, #fff4df 0%, #ffe082 100%);
    border-color: #ffb74d;
    color: #9a6800;
    cursor: default;
  }

  .maps-missing:hover {
    transform: none;
    box-shadow: none;
  }

  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 40px;
    padding: 20px 16px;
  }

  @media (max-width: 640px) {
    header { padding: 24px 16px 32px; }
    header h1 { font-size: 1.3rem; }
    .controls {
      flex-wrap: wrap;
      align-items: stretch;
    }
    #search { width: 100%; flex-basis: 100%; }
    .filter-btn, #installBtn, #resetBtn {
      flex: 1 1 calc(50% - 10px);
      min-width: 110px;
    }
    .zone summary { font-size: 0.95rem; padding: 14px 14px; }
    .install-banner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

<header>

  <p>Your personal pandal-hopping checklist</p>
  <div class="countdowns">
    <div class="countdown-box">Shashthi<b id="cdShashthi">--</b></div>

  <button id="resetBtn">↻ Reset</button>
</div>

<main id="app"></main>

<footer>📍 Progress saved automatically • Works offline</footer>

<script>
const data = [

    {name:"Nimtala Sarbojanin"},

    {name:"Abasar Sarbojanin"},

  { zone:"Netaji Bhawan / Bhowanipore", items:[

const STORAGE_KEY = "pujoTrackerState2026";

function loadState(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function slug(zone, name){
  return (zone + "_" + name).replace(/\s+/g,"_").replace(/[^\w]/g,"");
}

let state = loadState();

data.forEach(z => z.items.forEach(it => {
  const id = slug(z.zone, it.name);
  if (!(id in state)) {
    state[id] = { visited: !!it.visited, note: "" };
  }
}));
saveState(state);

const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  const searchTerm = document.getElementById("search").value.toLowerCase();
  const activeFilter = document.querySelector(".filter-btn.active").dataset.filter;

  let totalAll = 0, visitedAll = 0;

  data.forEach(z => {
    let zoneVisited = 0, zoneTotal = 0;
    const rows = [];

    z.items.forEach(it => {
      const id = slug(z.zone, it.name);
      const st = state[id];
      zoneTotal++; totalAll++;
      if (st.visited) { zoneVisited++; visitedAll++; }

      const matchesSearch = it.name.toLowerCase().includes(searchTerm);
      const matchesFilter = activeFilter === "all" ||
        (activeFilter === "visited" && st.visited) ||
        (activeFilter === "pending" && !st.visited);

      if (!matchesSearch || !matchesFilter) return;

      const mapHtml = it.maps
        ? `<a class="maps-btn" href="${it.maps}" target="_blank" rel="noopener noreferrer">📍 Maps</a>`
        : `<span class="maps-btn maps-missing">📍 No link</span>`;

      const row = document.createElement("div");
      row.className = "pandal-row" + (st.visited ? " checked" : "");
      row.innerHTML = `
        <input type="checkbox" ${st.visited ? "checked" : ""} data-id="${id}">
        <div class="pandal-info">
          <span class="pandal-name" data-id="${id}">${it.name}</span>
          ${it.uncertain ? '<span class="uncertain-tag">⚠ verify</span>' : ''}
          <span class="note-toggle" data-id="${id}">📝 note</span>
          <input type="text" class="note-input" data-id="${id}" placeholder="Add a note..." value="${st.note || ''}">
          ${mapHtml}
        </div>
      `;
      rows.push(row);
    });

    if (rows.length === 0) return;

    const details = document.createElement("details");
    details.className = "zone";
    details.open = true;
    const summary = document.createElement("summary");
    summary.innerHTML = `<span>${z.zone}</span><span class="zone-count">${zoneVisited}/${zoneTotal}</span>`;
    const body = document.createElement("div");
    body.className = "zone-body";
    rows.forEach(r => body.appendChild(r));
    details.appendChild(summary);
    details.appendChild(body);
    app.appendChild(details);
  });

  const pct = totalAll ? Math.round((visitedAll / totalAll) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressBar").textContent = pct > 8 ? pct + "%" : "";
  document.getElementById("progressLabel").textContent = `${visitedAll} / ${totalAll} pandals visited`;

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => {
    cb.addEventListener("change", e => {
      const id = e.target.dataset.id;
      state[id].visited = e.target.checked;
      saveState(state);
      render();
    });
  });

  document.querySelectorAll(".pandal-name").forEach(el => {
    el.addEventListener("click", e => {
      const id = e.target.dataset.id;
      const cb = document.querySelector(`input[data-id="${id}"]`);
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event("change"));
    });
  });

  document.querySelectorAll(".note-toggle").forEach(el => {
    el.addEventListener("click", e => {
      const id = e.target.dataset.id;
      const input = document.querySelector(`.note-input[data-id="${id}"]`);
      input.style.display = input.style.display === "block" ? "none" : "block";
    });
  });

  document.querySelectorAll(".note-input").forEach(el => {
    if (el.value) el.style.display = "block";
    el.addEventListener("input", e => {
      const id = e.target.dataset.id;
      state[id].note = e.target.value;
      saveState(state);
    });
  });
}

document.getElementById("search").addEventListener("input", render);
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all progress and notes? This cannot be undone.")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

const installBtn = document.getElementById("installBtn");
const installBanner = document.getElementById("installBanner");
const closeInstallBannerBtn = document.getElementById("closeInstallBanner");

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
  installBtn.style.display = "inline-block";
  installBanner.classList.remove("hidden");
  installBanner.innerHTML = '<span><strong>Install this app:</strong> Tap the install button or use your browser menu → Install app.</span><button id="closeInstallBanner" type="button">Close</button>';
  document.getElementById("closeInstallBanner").addEventListener("click", () => {
    installBanner.classList.add("hidden");
  });
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) {
    installBanner.classList.remove("hidden");
    installBanner.innerHTML = '<span><strong>Install manually:</strong> Chrome/Edge → menu → Install app. iPhone → Safari → Share → Add to Home Screen.</span><button id="closeInstallBanner" type="button">Close</button>';
    document.getElementById("closeInstallBanner").addEventListener("click", () => {
      installBanner.classList.add("hidden");
    });
    return;
  }

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
  installBanner.classList.add("hidden");
});

closeInstallBannerBtn.addEventListener("click", () => {
  installBanner.classList.add("hidden");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((error) => {
      console.error("Service worker registration failed:", error);
    });
  });
}

setTimeout(() => {
  if (!deferredPrompt) {
    installBanner.classList.remove("hidden");
  }
}, 2000);

function updateCountdown(){
  const now = new Date();
  const shashthi = new Date("2026-10-17T00:00:00");
  const dashami = new Date("2026-10-21T00:00:00");
  const dayMs = 1000 * 60 * 60 * 24;
  const dS = Math.ceil((shashthi - now) / dayMs);
  const dD = Math.ceil((dashami - now) / dayMs);
  document.getElementById("cdShashthi").textContent = dS >= 0 ? dS + "d" : "✓";
  document.getElementById("cdDashami").textContent = dD >= 0 ? dD + "d" : "✓";
}
updateCountdown();
render();
</script>
</body>
</html>
